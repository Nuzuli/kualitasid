[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kualitasid"
version = "0.2.0"
description = "Profil dan pembersih kualitas data (pandas) untuk format Indonesia: NIK, NPWP, HP, Rupiah, tanggal, plat, provinsi, plus cek konsistensi antar kolom"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["pandas>=1.5"]
keywords = ["data-quality", "indonesia", "data-cleaning", "pandas", "nik", "npwp"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Intended Audience :: Developers",
  "Topic :: Scientific/Engineering :: Information Analysis",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
kualitasid = "kualitasid.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project.urls]
Homepage = "https://github.com/Nuzuli/kualitasid"
Issues = "https://github.com/Nuzuli/kualitasid/issues"